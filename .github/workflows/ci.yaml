name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: python -m unittest -v

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: qwen-tts-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Imports everything the server needs (the model is not downloaded).
      - name: Smoke test
        run: |
          docker run --rm --entrypoint python3 qwen-tts-server:ci -c \
            "import fastapi, uvicorn, soundfile, torch, qwen_tts; import ast; ast.parse(open('server.py').read()); import text"
